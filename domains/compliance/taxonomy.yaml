# Category taxonomy for the compliance domain. What the ticket is about, used for
# routing and FAQ lookup. triage.taxonomy builds Category from this file at import
# time - the enum member name is the id upper-cased, the value is the id itself.
categories:
  - id: frameworks
    description: SOC 2 / ISO 27001 / GDPR scoping and setup
  - id: controls
    description: implementing and tracking controls
  - id: evidence
    description: collecting and uploading evidence
  - id: integrations
    description: connecting cloud/SaaS accounts to auto-collect evidence
  - id: policies
    description: policy templates, customization, and approvals
  - id: access_management
    description: users, roles, permissions, and access reviews
  - id: audits
    description: audit preparation and auditor access
  - id: account_billing
    description: account setup, subscription, and billing
